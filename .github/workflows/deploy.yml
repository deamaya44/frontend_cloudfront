name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ${{ secrets.S3_FRONTEND_BUCKET }}
  S3_PREFIX: ${{ secrets.S3_FRONTEND_PREFIX }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  LAMBDA_API_URL: ${{ secrets.LAMBDA_API_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate config.js with Lambda API URL
        run: |
          cat > config.js << EOF
          // Configuration file - Auto-generated during deployment
          const API_URL = '${{ env.LAMBDA_API_URL }}';
          EOF
          echo "Generated config.js with API_URL: ${{ env.LAMBDA_API_URL }}"

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }} \
            --exclude ".git/*" \
            --exclude "README.md" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --delete \
            --cache-control "public, max-age=31536000" \
            --metadata-directive REPLACE

      - name: Set cache control for HTML and config files
        run: |
          # No cache for HTML files
          aws s3 cp s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}index.html s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE
          
          # No cache for config.js to ensure latest API URL
          aws s3 cp s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}config.js s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}config.js \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/${{ env.S3_PREFIX }}*"

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed successfully!"
          echo "📦 S3 Bucket: ${{ env.S3_BUCKET }}"
          echo "📁 S3 Prefix: ${{ env.S3_PREFIX }}"
          echo "🔗 API URL: ${{ env.LAMBDA_API_URL }}"
          echo "🌐 CloudFront Distribution: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "🔄 Cache invalidation in progress..."
          echo "🔁 Files will be replicated automatically to secondary region"
